<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} field-wide{% endif %}">
  {% if field.widget_type == 'checkbox' %}
  <label class="check">{{ field }} <span>{{ field.label|capfirst }}</span></label>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label|capfirst }}{% if not field.field.required %} <span class="g-optional">facultatif</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="g-help">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
